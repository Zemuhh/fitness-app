<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FitClub" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #E2E8F0;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      @media (max-width: 480px) {
        html,
        body,
        #root {
          background-color: #F4F7FB;
        }
      }
      @media (min-width: 481px) {
        [aria-modal="true"] {
          max-width: 430px !important;
          margin-left: auto !important;
          margin-right: auto !important;
          overflow: hidden !important;
        }
      }
    </style>
  </head>

  <body>
    <noscript>FitClub Studio uygulamasını çalıştırmak için JavaScript etkinleştirilmelidir.</noscript>
    <div id="root"></div>
  </body>
</html>
